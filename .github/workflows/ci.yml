name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: |
          pytest --cov=ruin_theory --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --cov-report=html
      - name: Check validation notebooks
        run: python scripts/check_validation_notebooks.py
      - name: Build docs
        run: mkdocs build --strict
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_release_artifacts.py dist/*.tar.gz dist/*.whl
      - name: Smoke test the installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'from ruin_theory import CramerLundbergProcess, exponential, ultimate_ruin_exponential; m = CramerLundbergProcess(claim_arrival_rate=3, claim_distribution=exponential(5)); assert abs(float(ultimate_ruin_exponential(m, 0)) - 0.6) < 1e-12'
